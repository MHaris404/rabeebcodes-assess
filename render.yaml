services:
  - type: web
    name: supportdesk-api
    runtime: node
    buildCommand: npm ci --include=dev
    preDeployCommand: npm run db:migrate
    startCommand: npm run start -w server
    healthCheckPath: /api/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
      - key: COOKIE_SAME_SITE
        value: none
      - key: DATABASE_URL
        fromDatabase:
          name: supportdesk-db
          property: connectionString
databases:
  - name: supportdesk-db
    databaseName: supportdesk
    user: supportdesk
